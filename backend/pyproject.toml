[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rakshak"
version = "0.1.0"
description = "Rakshak - farm-to-fork traceability backend (SIH26232)"
requires-python = ">=3.11"
# Core = codec only (what the simulator installs). Everything else is an extra.
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "aiomqtt>=2.0",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "psycopg[binary]>=3.1",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "structlog>=24.1",
  "python-multipart>=0.0.9",
]
ml = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "joblib>=1.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["rakshak*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["integration: needs the docker-compose mosquitto broker"]
