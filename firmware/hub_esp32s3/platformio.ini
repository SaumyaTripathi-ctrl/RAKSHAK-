; Rakshak Hub - ESP32-S3. NOT HARDWARE-TESTED (compiles in CI only).
[platformio]
default_envs = hub_esp32s3

[env:hub_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
    -std=gnu++17
    -I../common/include
    -DRK_DEVICE_KIND_HUB=1
build_src_filter =
    +<*>
    +<../../common/src/rk_codec.c>
    +<../../common/src/rk_ring.c>
    +<../../common/src/rk_device.c>
    +<../../common/src/rk_edge.c>
    +<../../common/src/rk_cmd.c>
    +<../../common/src/rk_ble.c>
    +<../../common/src/rk_clock.c>
lib_deps =
    Wire
    SPI
    adafruit/Adafruit SHT31 Library@^2.2.2
    Preferences
    h2zero/NimBLE-Arduino@^2.1.0
