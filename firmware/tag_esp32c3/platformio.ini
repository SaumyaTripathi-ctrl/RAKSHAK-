; Rakshak Tag - ESP32-C3. NOT HARDWARE-TESTED (compiles in CI only).
; Arduino-ESP32 >= 3.0 is not shipped by the official espressif32 platform; the community
; pioarduino platform tracks Arduino-ESP32 3.x / ESP-IDF 5.x (see docs/DECISIONS.md).
[platformio]
default_envs = tag_esp32c3

[env:tag_esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -I../common/include
    -DRK_DEVICE_KIND_TAG=1
build_src_filter =
    +<*>
    +<../../common/src/rk_codec.c>
lib_deps =
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/Adafruit TCS34725@^1.4.4
