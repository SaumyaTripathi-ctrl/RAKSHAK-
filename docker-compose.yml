# Rakshak - one command: `docker compose up` (Docker Desktop on Windows; see README).
# Services are added phase by phase; this file always reflects what currently exists.

name: rakshak

services:
  # One-shot: creates a DEV-ONLY CA + broker certificate into the `certs` volume (idempotent).
  certs:
    image: alpine:3.20
    command: sh -c "apk add --no-cache openssl >/dev/null && sh /gen/gen-dev-certs.sh /certs"
    volumes:
      - certs:/certs
      - ./infra/certs/gen-dev-certs.sh:/gen/gen-dev-certs.sh:ro

  mosquitto:
    image: eclipse-mosquitto:2
    entrypoint: ["sh", "/mosquitto/entrypoint.sh"]
    environment:
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD:-dev-api-pass}
      MQTT_DEVICE_USERS: ${MQTT_DEVICE_USERS:-HUB-0001:dev-hub-0001,HUB-0002:dev-hub-0002,HUB-0003:dev-hub-0003}
    ports:
      - "8883:8883"
    volumes:
      - certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/acl:/mosquitto/config/acl:ro
      - ./infra/mosquitto/entrypoint.sh:/mosquitto/entrypoint.sh:ro
    depends_on:
      certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt -u rakshak-api -P \"$${MQTT_API_PASSWORD}\" -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rakshak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rakshak-dev}
      POSTGRES_DB: ${POSTGRES_DB:-rakshak}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      RAKSHAK_ENV: dev
      RAKSHAK_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rakshak}:${POSTGRES_PASSWORD:-rakshak-dev}@postgres:5432/${POSTGRES_DB:-rakshak}
      RAKSHAK_AUTO_CREATE_SCHEMA: "false"
      RAKSHAK_MQTT_ENABLED: "true"
      RAKSHAK_MQTT_HOST: mosquitto
      RAKSHAK_MQTT_PORT: "8883"
      RAKSHAK_MQTT_PASSWORD: ${MQTT_API_PASSWORD:-dev-api-pass}
      RAKSHAK_MQTT_CA_FILE: /certs/ca.crt
      RAKSHAK_MASTER_KEY_HEX: ${RAKSHAK_MASTER_KEY_HEX:-000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f}
      RAKSHAK_JWT_SECRET: ${RAKSHAK_JWT_SECRET:-dev-only-change-me-dev-only-change-me}
      RAKSHAK_SEED_DEMO: "true"
      RAKSHAK_DEMO_TOOLS: "true"  # admin-only DB tamper/restore endpoints used by the demo (dev only)
      RAKSHAK_SIMULATOR_URL: http://simulator:8100
      RAKSHAK_SIMULATOR_TOKEN: ${SIM_TOKEN:-dev-sim-token}
      RAKSHAK_LEDGER_PATH: /data/ledger.jsonl
    volumes:
      - certs:/certs:ro
      - api-data:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # SIMULATED devices: virtual hubs + tags speaking the real encrypted MQTT protocol (no hardware needed).
  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      RAKSHAK_API_URL: http://api:8000
      RAKSHAK_MASTER_KEY_HEX: ${RAKSHAK_MASTER_KEY_HEX:-000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f}
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
      MQTT_CA_FILE: /certs/ca.crt
      MQTT_DEVICE_USERS: ${MQTT_DEVICE_USERS:-HUB-0001:dev-hub-0001,HUB-0002:dev-hub-0002,HUB-0003:dev-hub-0003}
      SIM_DATA_DIR: /data
      SIM_TOKEN: ${SIM_TOKEN:-dev-sim-token}
      # Which scenarios play on which hub when the stack starts ('+' chains scenarios, then they loop).
      SIM_AUTOSTART: ${SIM_AUTOSTART:-HUB-0001:normal_trip+heat_excursion,HUB-0002:banana_ripening+normal_trip,HUB-0003:normal_trip+rural_no_network}
      SIM_LOOP: "true"
    volumes:
      - certs:/certs:ro
      - sim-data:/data
    depends_on:
      api:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:
  sim-data:
  certs:
  mosquitto-data:
  pgdata:
