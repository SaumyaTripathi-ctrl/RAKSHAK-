name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (codec, backend, ml, simulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ml -e "backend[api,dev]"
          if [ -f simulator/pyproject.toml ]; then python -m pip install -e simulator; fi
      - name: Lint
        run: python -m ruff check backend ml simulator tools
      - name: Test vectors are fresh
        run: python tools/gen_vectors.py --check
      - name: Tests
        run: |
          dirs="backend/tests"
          for d in ml/tests simulator/tests; do [ -d "$d" ] && dirs="$dirs $d"; done
          python -m pytest $dirs -q

  c-vectors:
    name: C codec vs Python vectors (mbedTLS 3.x pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host vector test
        run: CC=cc sh firmware/common/test/run_host_test.sh

  ledger-fabric:
    name: Fabric chaincode (go test) + bridge (node test) - no live network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Chaincode
        working-directory: ledger/fabric/chaincode
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bridge
        working-directory: ledger/fabric/bridge
        run: node --test test/server.test.js

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  firmware:
    name: Firmware build (${{ matrix.project }}) - compiles only, not hardware-tested
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [tag_esp32c3, hub_esp32s3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.project }}-${{ hashFiles(format('firmware/{0}/platformio.ini', matrix.project)) }}
      - run: python -m pip install platformio
      - run: pio run -d firmware/${{ matrix.project }}
