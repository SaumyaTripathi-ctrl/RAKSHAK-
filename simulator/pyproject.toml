[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rakshak-sim"
version = "0.1.0"
description = "Virtual Rakshak hub + tags publishing real encrypted, hash-chained MQTT traffic (SIMULATED devices)"
requires-python = ">=3.11"
# `rakshak` (codec only, installs with just `cryptography`) and `rakshak-ml` (physics) come from this repo:
#   pip install ./ml ./backend ./simulator
dependencies = ["aiomqtt>=2.0", "httpx>=0.27", "fastapi>=0.110", "uvicorn[standard]>=0.29", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
rakshak-sim = "rakshak_sim.__main__:main"

[tool.setuptools.packages.find]
include = ["rakshak_sim*"]

[tool.pytest.ini_options]
testpaths = ["sim_tests"]
asyncio_mode = "auto"
